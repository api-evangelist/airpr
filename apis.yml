apis:
- name: Onclusive Media API
  description: >-
    Data-as-a-Service access to Onclusive's media intelligence corpus — 28M+
    daily media content items across print, online, broadcast and social media,
    300K+ verified journalist contacts, and 250K+ global events — enriched with
    sentiment and relevance scoring, IPTC topic classification across 1,200+
    categories, entity recognition and social amplification metrics. Delivered
    as REST APIs or as scheduled/triggered XML and RSS feeds with customisable
    data schemas, for piping into BI tools, CRM systems and custom applications.
    This is the API surface that survives AirPR's absorption into Onclusive;
    airpr.com now 301s to onclusive.com. Access is sales-gated: Onclusive
    publishes no OpenAPI, no base URL, no authentication reference and no
    pricing, and the only routes in are a demo request and a contact form.
  humanURL: https://onclusive.com/what-we-do/monitoring/media-api/
  baseURL: null
  x-base-url-note: >-
    No base URL is published. Recorded as missing rather than guessed — the
    Media API product page names no host, and the developer portal that would
    carry the catalog is behind a Cognito login. Do not infer a host from the
    domain.
  x-access: sales-gated
