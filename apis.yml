name: AirPR
description: >-
  AirPR is a public relations analytics and media measurement company whose
  software helped communications teams quantify the business impact of earned
  media, tie coverage to web traffic and conversions, and benchmark share of
  voice against competitors. AirPR is now part of Onclusive, the media
  intelligence platform that monitors and enriches conversations across 3M+
  online sources, 70K+ print outlets, 6K+ broadcast channels, and 25+ social
  platforms for PR, communications, and marketing professionals. It was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network.
