note: >-
  DERIVED FROM A LIVE, ANONYMOUS OIDC DISCOVERY DOCUMENT — not from an OpenAPI,
  because Onclusive publishes no OpenAPI. AirPR was absorbed into Onclusive and
  airpr.com now 301s to onclusive.com, so the surviving developer surface is
  Onclusive's. https://developer.onclusive.com/ is an AWS API Gateway Developer
  Portal (the aws-samples serverless reference app) whose /config.js names
  Amazon Cognito user pool us-east-1_F0XmSWr9T with hosted-UI domain
  crawler-api-auth.onclusive.com. That user pool's OIDC discovery document is
  anonymously readable and is the only machine-readable contract-adjacent
  artifact this company publishes. The API catalog itself is NOT readable: the
  portal's backing REST API returns 403 "Missing Authentication Token" and the
  portal's own content bundle returns 403 AccessDenied from S3.
