# Recorded separately and DELIBERATELY NOT counted as a provider well-known hit.
# This is a real, anonymous, HTTP 200 OpenID Connect discovery document for the
# Amazon Cognito user pool that fronts developer.onclusive.com — we found it by
# reading the user pool id out of https://developer.onclusive.com/config.js.
# Every human-facing endpoint it advertises (authorize/token/revoke/userInfo/
# logout) is on crawler-api-auth.onclusive.com, a host Onclusive controls, so
# the authorization server is genuinely theirs. But the discovery DOCUMENT is
# served by Amazon at cognito-idp.us-east-1.amazonaws.com, not by an Onclusive
# host, so it does not earn a `WellKnown` pointer. It is used as the evidence
# base for authentication/ and scopes/ instead.
