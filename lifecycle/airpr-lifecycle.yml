source: https://onclusive.com/legal/service-level-agreement/
note: >-
  AirPR is absorbed into Onclusive (airpr.com 301s to onclusive.com), so the
  operative lifecycle commitments are Onclusive's published Service Level
  Agreement. The SLA is a contractual availability + support document covering
  the Onclusive platform generally; it names no API-specific commitment, and
  Onclusive publishes no API versioning policy, no deprecation policy, and no
  live status page.

sla:
  url: https://onclusive.com/legal/service-level-agreement/
  uptime_target: '99.9%'
  measurement_period: calendar month
  exclusions:
  - scheduled maintenance
  - emergency maintenance
  remedy: >-
    Service credit capped at seven (7) days of Average Daily Fees in any single
    month.
  support_targets:
  - severity: Level 1
    definition: System down or inaccessible
    response: Within 2 Business Hours
    workaround: 3 Business Hours
    resolution: 8 Business Hours
  - severity: Level 2
    definition: Significantly impairs use of the service
    response: Within 5 Business Hours
    workaround: 12 Business Hours
    resolution: 1 Business Day
  - severity: Level 3
    definition: Limited problem or documented failure
    response: Within 2 Business Days
    workaround: 3 Business Days
    resolution: 10 Business Days
  - severity: Level 4
    definition: Minor issue or feature request
    response: Within 2 Business Days
    workaround: 3 Business Days
    resolution: Later of 30 days or the next major software revision
  maintenance_windows:
  - Friday 22:00 to Saturday 05:00 Pacific Time
  - Saturday 22:00 to Sunday 05:00 Pacific Time
  - Other windows announced outside business hours
  maintenance_notice: Not less than twenty-four (24) hours in advance

